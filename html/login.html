<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - Spotify</title>
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

<div class="wrapper">

  <!-- Logo (clickable) -->
  <div class="logo">
    <a href="../index.html">
      <img src="../favicon.ico" alt="Spotify">
    </a>
  </div>

  <!-- Card -->
  <div class="card">

    <h1>Welcome back</h1>

    

    

    <!-- Form -->
    <form onsubmit="login(event)">

      <label>Email or username</label>
      <input id="email" type="text" placeholder="Email or username">

      <label>Password</label>
      <input id="password" type="password" placeholder="Password">

      <!-- Remember me -->
      <div class="check">
        <label>
          <input type="checkbox">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="login-btn">Log In</button>

    </form>
    <div class="divider"><span>or</span></div>
    <!-- Social -->
    <button class="social">Continue with Google</button>
    <button class="social">Continue with Facebook</button>
    <button class="social">Continue with Apple</button>

    <p class="forgot">
      <a href="#">Forgot your password?</a>
    </p>

    <p class="signup">
      Don’t have an account? <a href="signup.html">Sign up</a>
    </p>

  </div>

</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDg9DTIfT5Tgh26ioI1ZYy3sBSgzkg0HXk",
  authDomain: "spotify-clone-78a8c.firebaseapp.com",
  projectId: "spotify-clone-78a8c",
  storageBucket: "spotify-clone-78a8c.appspot.com",
  messagingSenderId: "742478344370",
  appId: "1:742478344370:web:34b342ff1ea347596359ab"
};

// 2. Initialize FIRST
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

function login(event) {
    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
            console.log("LOGIN SUCCESS");
            console.log(userCredential.user);

            alert("Login success"); // test

            window.location.href = "../index.html"; // redirect here
        })
        .catch((error) => {
            console.log("LOGIN ERROR:", error.message);
        });
}

window.login = login;
</script>
</body>
</html>
