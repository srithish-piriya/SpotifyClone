<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify - Sign up</title>
  <link rel="stylesheet" href="../css/signup.css">
</head>
<body>

<div class="wrapper">

  <!-- Logo -->
  <div class="logo">
  <a href="../index.html">
    <img src="../favicon.ico" alt="Spotify">
  </a>
</div>

  <!-- Card -->
  <div class="card">
    <h1>Sign up to start listening</h1>

    

   

    <!-- Form -->
    <form>
      <label>Email address</label>
      <input id="email" type="email" placeholder="name@domain.com">

      <label>Password</label>
      <input id="password" type="password" placeholder="Create a password">

      <label>Profile name</label>
      <input id="name" type="text" placeholder="Your name">

      <label>Date of birth</label>
      <div class="dob">
        <input type="number" placeholder="DD">
        <input type="text" placeholder="Month">
        <input type="number" placeholder="YYYY">
      </div>

      <label>Gender</label>
      <div class="gender">
        <label><input type="radio" name="g"> Male</label>
        <label><input type="radio" name="g"> Female</label>
        <label><input type="radio" name="g"> Other</label>
      </div>

      <div class="check">
  <label>
    <input type="checkbox">
    <span>I agree to the Terms and Privacy Policy</span>
  </label>
</div>

      <button class="signup-btn">Sign up</button>
    </form>
     <div class="divider"><span>or</span></div>
<!-- Social -->
    <button class="social">Continue with Google</button>
    <button class="social">Continue with Facebook</button>
    <button class="social">Continue with Apple</button>
    <p class="login">
      Already have an account? <a href="#">Log in</a>
    </p>
  </div>

</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDg9DTIfT5Tgh26ioI1ZYy3sBSgzkg0HXk",
  authDomain: "spotify-clone-78a8c.firebaseapp.com",
  projectId: "spotify-clone-78a8c",
  storageBucket: "spotify-clone-78a8c.appspot.com",
  messagingSenderId: "742478344370",
  appId: "1:742478344370:web:34b342ff1ea347596359ab"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// SIGNUP BUTTON
document.querySelector(".signup-btn").addEventListener("click", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const name = document.getElementById("name").value.trim();

    //  VALIDATION
    if (!email || !password || !name) {
        alert("All fields are required!");
        return;
    }

    if (password.length < 6) {
        alert("Password must be at least 6 characters");
        return;
    }

    if (!email.includes("@")) {
        alert("Enter a valid email");
        return;
    }

    //  CREATE USER
    try {
        await createUserWithEmailAndPassword(auth, email, password);

        alert("Signup successful!");

        // redirect to login page
        window.location.href = "login.html";

    } catch (error) {
        alert(error.message);
    }
});
</script>
</body>
</html>
