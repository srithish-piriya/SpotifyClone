<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify - Sign up</title>
  <link rel="stylesheet" href="../css/signup.css">
</head>
<body>

<div class="wrapper">

  <!-- Logo -->
  <div class="logo">
  <a href="../index.html">
    <img src="../favicon.ico" alt="Spotify">
  </a>
</div>

  <!-- Card -->
  <div class="card">
    <h1>Sign up to start listening</h1>

    

   

    <!-- Form -->
    <form>
      <label>Email address</label>
      <input type="email" placeholder="name@domain.com">

      <label>Password</label>
      <input type="password" placeholder="Create a password">

      <label>Profile name</label>
      <input type="text" placeholder="Your name">

      <label>Date of birth</label>
      <div class="dob">
        <input type="number" placeholder="DD">
        <input type="text" placeholder="Month">
        <input type="number" placeholder="YYYY">
      </div>

      <label>Gender</label>
      <div class="gender">
        <label><input type="radio" name="g"> Male</label>
        <label><input type="radio" name="g"> Female</label>
        <label><input type="radio" name="g"> Other</label>
      </div>

      <div class="check">
  <label>
    <input type="checkbox">
    <span>I agree to the Terms and Privacy Policy</span>
  </label>
</div>

      <button class="signup-btn">Sign up</button>
    </form>
     <div class="divider"><span>or</span></div>
<!-- Social -->
    <button class="social">Continue with Google</button>
    <button class="social">Continue with Facebook</button>
    <button class="social">Continue with Apple</button>
    <p class="login">
      Already have an account? <a href="#">Log in</a>
    </p>
  </div>

</div>

</body>
</html>
